    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const ch = urlParams.get("ch");
    const player = document.getElementById("livePlayer");
    const title = document.getElementById("channelTitle");
      
      if (ch && channels[ch] && player && title) {
        const channel = channels[ch];
        player.src = channel.src;
        title.textContent = `${channel.name} ⚽`;
        
        // Track viewing history (if Storage is available from script.js)
        if (typeof History !== 'undefined') {
          History.add(ch, channel.name);
        }
        if (typeof Analytics !== 'undefined') {
          Analytics.track('channel_view', { channelId: ch, channelName: channel.name });
        }
      }
    });
